services:
  localstack:
    image: localstack/localstack:2.3
    container_name: jobmatch-localstack
    ports:
      - '4566:4566'
    environment:
      - SERVICES=dynamodb,sqs,s3
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOCALSTACK_HOSTNAME=localstack
      - DATA_DIR=/tmp/localstack
    volumes:
      - localstack_data:/tmp/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'curl -s http://localhost:4566/_localstack/health | grep -q available || exit 1',
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - jobmatch-network

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: jobmatch-api-gateway
    ports:
      - '${API_GATEWAY_PORT}:3000'
    environment:
      NODE_ENV: ${NODE_ENV}
      API_GATEWAY_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_SERVICE_URL: http://auth-service:${AUTH_SERVICE_PORT}
      USER_SERVICE_URL: http://user-service:${USER_SERVICE_PORT}
      JOB_SERVICE_URL: http://job-service:${JOB_SERVICE_PORT}
      APPLICATION_SERVICE_URL: http://application-service:${APPLICATION_SERVICE_PORT}
      EMAIL_SERVICE_URL: http://email-service:${EMAIL_SERVICE_PORT}
      CV_ANALYSIS_SERVICE_URL: http://cv-analysis-service:${CV_ANALYSIS_SERVICE_PORT}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      email-service:
        condition: service_healthy
      cv-analysis-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: jobmatch-auth-service
    ports:
      - '${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}'
    environment:
      NODE_ENV: ${NODE_ENV}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
      DYNAMODB_TABLE_USERS: ${DYNAMODB_TABLE_USERS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT}
    depends_on:
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${AUTH_SERVICE_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: jobmatch-user-service
    ports:
      - '${USER_SERVICE_PORT}:${USER_SERVICE_PORT}'
    environment:
      NODE_ENV: ${NODE_ENV}
      USER_SERVICE_PORT: ${USER_SERVICE_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
      DYNAMODB_TABLE_USERS: ${DYNAMODB_TABLE_USERS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${USER_SERVICE_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  job-service:
    build:
      context: .
      dockerfile: services/job-service/Dockerfile
    container_name: jobmatch-job-service
    ports:
      - '${JOB_SERVICE_PORT}:${JOB_SERVICE_PORT}'
    environment:
      NODE_ENV: ${NODE_ENV}
      JOB_SERVICE_PORT: ${JOB_SERVICE_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
      DYNAMODB_TABLE_JOBS: ${DYNAMODB_TABLE_JOBS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${JOB_SERVICE_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  application-service:
    build:
      context: .
      dockerfile: services/application-service/Dockerfile
    container_name: jobmatch-application-service
    ports:
      - '${APPLICATION_SERVICE_PORT}:${APPLICATION_SERVICE_PORT}'
    environment:
      NODE_ENV: ${NODE_ENV}
      APPLICATION_SERVICE_PORT: ${APPLICATION_SERVICE_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
      DYNAMODB_TABLE_APPLICATIONS: ${DYNAMODB_TABLE_APPLICATIONS}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SQS_ENDPOINT: ${SQS_ENDPOINT}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${APPLICATION_SERVICE_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  email-service:
    build:
      context: .
      dockerfile: services/email-service/Dockerfile
    container_name: jobmatch-email-service
    ports:
      - '${EMAIL_SERVICE_PORT}:${EMAIL_SERVICE_PORT}'
    environment:
      NODE_ENV: ${NODE_ENV}
      EMAIL_SERVICE_PORT: ${EMAIL_SERVICE_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
      DYNAMODB_TABLE_EMAILS: ${DYNAMODB_TABLE_EMAILS}
      SQS_ENDPOINT: ${SQS_ENDPOINT}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      localstack:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${EMAIL_SERVICE_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  cv-analysis-service:
    build:
      context: .
      dockerfile: services/cv-analysis-service/Dockerfile
    container_name: jobmatch-cv-analysis-service
    ports:
      - '${CV_ANALYSIS_SERVICE_PORT}:${CV_ANALYSIS_SERVICE_PORT}'
    environment:
      NODE_ENV: ${NODE_ENV}
      CV_ANALYSIS_SERVICE_PORT: ${CV_ANALYSIS_SERVICE_PORT}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${CV_ANALYSIS_SERVICE_PORT}/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - jobmatch-network
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: jobmatch-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jobmatch-network

  job-seeker-frontend:
    build:
      context: .
      dockerfile: frontend/job-seeker-module/Dockerfile
    container_name: jobmatch-job-seeker-frontend
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: http://api-gateway:3000
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4001/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobmatch-network
    restart: unless-stopped

  shell-frontend:
    build:
      context: .
      dockerfile: frontend/shell/Dockerfile
    container_name: jobmatch-shell-frontend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXT_PUBLIC_API_URL: http://api-gateway:3000
      NEXT_PUBLIC_WS_URL: ws://api-gateway:3000
      NEXT_PUBLIC_JOB_SEEKER_REMOTE_URL: http://job-seeker-frontend:4001
    depends_on:
      api-gateway:
        condition: service_healthy
      job-seeker-frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jobmatch-network
    restart: unless-stopped

networks:
  jobmatch-network:
    driver: bridge

volumes:
  localstack_data:
    driver: local
